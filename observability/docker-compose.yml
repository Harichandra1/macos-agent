# Local observability stack (Phase 4): Prometheus scrapes the agent's /metrics,
# Grafana renders the provisioned dashboard. Start the agent first (uvicorn on
# :8000), then `docker compose -f observability/docker-compose.yml up`.
#
# Grafana → http://localhost:3000  (anonymous viewer enabled for local use;
# lock this down in the Phase 5 deployment / use Grafana Cloud's hosted stack).
# Prometheus → http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: macos-agent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the host-run agent on Linux

  grafana:
    image: grafana/grafana:11.2.0
    container_name: macos-agent-grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
