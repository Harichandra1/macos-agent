# Prometheus scrape config for the macOS agent (Phase 4).
# The agent exposes text-format metrics at GET /metrics (app/metrics.py).
#
# host.docker.internal resolves to the host from inside the Prometheus
# container, so this works when the agent runs on the host (uvicorn) and
# Prometheus runs via observability/docker-compose.yml. If the agent is ALSO
# containerized, replace the target with its service name.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: macos-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: macos-agent
