# Load every dashboard JSON under /var/lib/grafana/dashboards on startup.
apiVersion: 1

providers:
  - name: macos-agent
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
