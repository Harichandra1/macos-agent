# LEGACY OPTIONAL DEPLOYMENT — not the active zero-cost production path.
# The active path is deploy/oracle/ (Oracle VM + Neon + Caddy + Grafana Alloy).
# Render's free service/database limits make this blueprint unsuitable for the
# requested no-sleep deployment; keep it only as a reference alternative.
#
# Render Blueprint for the macOS Troubleshooting Agent (Phase 5 / V3).
#
# Provisions the full production stack from one file:
#   - a Docker web service (backend API + static frontend),
#   - a managed Postgres database (users, credits, cost ledger, feedback, AND
#     the LangGraph conversation checkpointer — see below),
#   - a weekly cron job that refreshes credit allowances.
#
# V3: DATABASE_URL alone is enough to make conversation memory durable —
# make_memory_checkpointer() (Agent/backend/app/agent/graph.py) detects a
# Postgres DATABASE_URL and backs the LangGraph checkpointer with the SAME
# database, so multi-turn memory survives restarts/redeploys and is shared
# across workers. No separate AGENT_CHECKPOINT_DB var needed in production —
# that var remains a SQLite dev-convenience fallback only.
#
# Deploy: push to GitHub, then Render → New → Blueprint → point at this repo.
# Secrets (sync: false) are entered once in the dashboard and NEVER committed.
# AUTH_JWT_SECRET is generated by Render so sessions survive restarts without
# anyone handling the value.
#
# NOTE: Render's free Postgres expires ~30 days after creation — fine for a
# demo, but upgrade the plan (or re-provision) for anything long-lived. See
# Agent/DEPLOY.md for the full runbook, rollback, and Grafana Cloud wiring.

databases:
  - name: macos-agent-db
    plan: free
    databaseName: macosagent
    user: macosagent

services:
  # --- Web service: the API + frontend --------------------------------------
  - type: web
    name: macos-agent
    runtime: docker
    plan: free
    dockerfilePath: Agent/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # DB — wired from the managed Postgres above (bare postgresql:// URL;
      # the app normalizes it to the psycopg driver on load). Backs BOTH the
      # relational schema (users/credits/feedback) AND, as of V3, the
      # LangGraph conversation checkpointer.
      - key: DATABASE_URL
        fromDatabase:
          name: macos-agent-db
          property: connectionString

      # Auth — session-JWT secret generated + stored by Render.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID          # enables Google Sign-In; unset = open mode
        sync: false

      # Infra credentials the agent always needs.
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: macos_kb
      - key: TAVILY_API_KEY            # web-search fallback; agent works without it
        sync: false

      # Production hardening.
      - key: CORS_ORIGINS              # set to your exact frontend origin(s)
        sync: false
      - key: WEB_CONCURRENCY           # safe to raise: the Postgres checkpointer is shared across workers
        value: "1"
      - key: PII_REDACTION
        value: "true"

      # Credit policy (defaults match the v2.0 plan; override here if needed).
      - key: WEEKLY_CREDIT_LIMIT
        value: "5"
      - key: MONTHLY_COST_CAP_USD
        value: "0.25"

  # --- Cron: weekly credit refresh ------------------------------------------
  # Monday 00:00 UTC. Belt-and-braces with credits.py's lazy per-access reset;
  # this also refreshes accounts of users who don't return that week so the DB
  # is clean for reporting. Same image, different command.
  - type: cron
    name: macos-agent-weekly-credits
    runtime: docker
    plan: free
    dockerfilePath: Agent/Dockerfile
    dockerContext: .
    schedule: "0 0 * * 1"
    dockerCommand: python -m app.jobs reset-weekly-credits
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: macos-agent-db
          property: connectionString
      - key: WEEKLY_CREDIT_LIMIT
        value: "5"
