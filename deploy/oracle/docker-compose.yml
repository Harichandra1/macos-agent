name: macos-agent

services:
  app:
    # Prebuilt by .github/workflows/build-image.yml and pulled from GHCR. The
    # Always Free VM does not have the RAM to run `uv sync` for this dependency
    # tree, so the image is never built on the host. APP_IMAGE_TAG is set to a
    # commit SHA by deploy.sh/rollback.sh so the running image always matches
    # the checked-out compose and Caddy config.
    image: ${APP_IMAGE:-ghcr.io/harichandra1/macos-agent}:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - ${PRODUCTION_ENV_FILE:-../../.env.production}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  duckdns:
    image: curlimages/curl:8.12.1
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:?DUCKDNS_DOMAIN must be set in .env.production}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN must be set in .env.production}
    entrypoint: ["/bin/sh", "-c"]
    # MUST be a literal block (|), not a folded one (>-). In a folded scalar,
    # lines indented deeper than the first line keep their newlines instead of
    # being joined — which split this into a bare `curl` with no URL followed by
    # the URL as its own command. Keep the backslash continuation explicit.
    # Empty ip= tells DuckDNS to use the request's source address, so the record
    # follows the VM automatically if Oracle assigns a new public IP.
    command:
      - |
        while true; do
          curl --fail --silent --show-error "https://www.duckdns.org/update?domains=$$DUCKDNS_DOMAIN&token=$$DUCKDNS_TOKEN&ip=" \
            && echo "duckdns: updated $$DUCKDNS_DOMAIN"
          sleep 300
        done
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ${PRODUCTION_ENV_FILE:-../../.env.production}
    # sys.env() in config.alloy returns "" for anything unset, so a missing
    # variable produces a component that silently ships nothing. Declaring them
    # with ${VAR:?} (same form caddy and duckdns use) makes `compose config`
    # fail by name instead — and deploy.sh runs `compose config` BEFORE pulling,
    # so the deploy aborts before anything changes.
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in .env.production}
      GRAFANA_PROMETHEUS_REMOTE_WRITE_URL: ${GRAFANA_PROMETHEUS_REMOTE_WRITE_URL:?GRAFANA_PROMETHEUS_REMOTE_WRITE_URL must be set in .env.production}
      GRAFANA_PROMETHEUS_USERNAME: ${GRAFANA_PROMETHEUS_USERNAME:?GRAFANA_PROMETHEUS_USERNAME must be set in .env.production}
      GRAFANA_LOKI_WRITE_URL: ${GRAFANA_LOKI_WRITE_URL:?GRAFANA_LOKI_WRITE_URL must be set in .env.production}
      GRAFANA_LOKI_USERNAME: ${GRAFANA_LOKI_USERNAME:?GRAFANA_LOKI_USERNAME must be set in .env.production}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:?GRAFANA_CLOUD_API_KEY must be set in .env.production}
    # --server.http.listen-addr is REQUIRED: Alloy binds container-loopback by
    # default, so publishing the port without it reaches nothing. The
    # "127.0.0.1:" host prefix keeps the UI off the public interface — reach it
    # with an SSH tunnel, and never open 12345 in the VCN.
    command: ["run", "/etc/alloy/config.alloy",
              "--storage.path=/var/lib/alloy",
              "--server.http.listen-addr=0.0.0.0:12345"]
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  alloy_data: